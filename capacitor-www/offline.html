<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<title>You're offline · We Party</title>

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #07060c; color: #f5f3ff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100dvh; display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    box-sizing: border-box;
    background: radial-gradient(circle at 15% 10%, #ff2e8833, transparent 45%),
                radial-gradient(circle at 90% 95%, #22d3ee26, transparent 45%), #07060c; }
  .bars { display: inline-flex; align-items: flex-end; gap: 6px; height: 48px; margin-bottom: 28px; }
  .bars span { width: 8px; border-radius: 99px; background: linear-gradient(180deg, #ff2e88, #8b5cf6 55%, #22d3ee); opacity: .55; }
  h1 { font-size: 28px; margin: 0 0 10px; font-weight: 900; letter-spacing: -0.02em; }
  p { margin: 0 auto 28px; max-width: 320px; color: #a39fbd; line-height: 1.5; }
  button { border: 0; border-radius: 999px; padding: 14px 28px; font: inherit; font-weight: 700; color: white;
    background: linear-gradient(120deg, #ff2e88, #8b5cf6); box-shadow: 0 10px 30px -10px #ff2e88b3; cursor: pointer; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <main>
    <div class="bars" aria-hidden="true"><span style="height:45%"></span><span style="height:85%"></span><span style="height:65%"></span><span style="height:100%"></span></div>
    <h1>You're offline</h1>
    <p>We Party needs an internet connection to keep the party live. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.href = window.WEPARTY_URL || "https://weparty-one.vercel.app"">Try again</button>
  </main>
  <script>
    // Come back automatically as soon as the connection returns.
    window.addEventListener("online", function () { location.href = window.WEPARTY_URL || "https://weparty-one.vercel.app"; });
  </script>
</body>
</html>
